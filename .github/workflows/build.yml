name: Build executables

# Build on every tag like v1.0.0 and publish the executables as artifacts.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build combined launcher
        run: pyinstaller shell/build.spec

      - name: Build individual apps
        run: |
          pyinstaller packages/app_comms/build.spec
          pyinstaller packages/app_firmware/build.spec

      - name: Upload executables as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: introsat-toolbox-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach executables to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
