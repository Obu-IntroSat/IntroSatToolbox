name: Build executables

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # НОВЫЙ ШАГ: установка core-пакета
      - name: Install satcore
        run: |
          pip install packages/core

      - name: Build combined launcher
        run: pyinstaller shell/build.spec

      - name: Build individual apps
        run: |
          pyinstaller packages/app_comms/build.spec
          pyinstaller packages/app_firmware/build.spec

      # НОВЫЙ ШАГ: сборка камеры
      - name: Build camera app
        run: |
          # если есть spec-файл:
          # pyinstaller packages/cam_introsat/build.spec
          # или прямая команда:
          pyinstaller --onefile --windowed --hidden-import=satcore --collect-all satcore cam_introsat/__main__.py

      - name: Package build
        shell: bash
        run: |
          archive="introsat-toolbox-${{ matrix.platform }}-${{ env.VERSION }}.tar.gz"
          tar -czf "$archive" -C dist .
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: introsat-toolbox-${{ matrix.platform }}-${{ env.VERSION }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Attach archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true