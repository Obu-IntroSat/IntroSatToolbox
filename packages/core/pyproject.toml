[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "satcore"
version = "0.1.0"
description = "Core library for Introsat applications"
requires-python = ">=3.10"
dependencies = []   # или укажите общие зависимости

[tool.setuptools.packages.find]
where = ["."]
include = ["satcore*"]