[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "satcore"
version = "0.1.0"
description = "Core library for IntroSat applications"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    # PySide6 не требуется, если core не использует Qt напрямую,
    # но если использует – добавьте "PySide6>=6.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["satcore*"]